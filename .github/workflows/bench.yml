name: Benchmark

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:

  benchmark:
    name: Benchmark ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: "aarch64"
          runner: "ubuntu-24.04-arm"
        - name: "x86_64"
          runner: "ubuntu-latest"

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Update rust
      run: rustup update

    - name: Info
      run: |
        cat /proc/cpuinfo | grep 'model name' | uniq
        cargo rustc -- --version

    # Plots the throughput to an .svg, and writes the results as markdown tables, which the commit job puts in the README
    - name: Benchmark
      run: |
        cargo bench --bench hashset > hashset.md
        cargo bench --bench throughput --features bench-plot,bench-md > throughput.md
        cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
        { echo "$cpu, $(rustc --version | cut -d ' ' -f 1-2), $(date -u +%F)"; echo; cat hashset.md; echo; cat throughput.md; } > benches/throughput/${{ matrix.name }}.md

    - uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.name }}
        path: |
          benches/throughput/${{ matrix.name }}.svg
          benches/throughput/${{ matrix.name }}.md
        overwrite: true

  commit:
    name: Commit & Push
    runs-on: ubuntu-latest
    needs: [benchmark]

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Download Benchmark Results
      uses: actions/download-artifact@v4
      with:
        path: benches/throughput
        merge-multiple: true

    # Replaces the results of each architecture in the README, between its <!-- bench:arch --> markers
    - name: Update README
      run: |
        python3 - <<'PY'
        import pathlib, re
        readme = pathlib.Path("README.md")
        text = readme.read_text()
        for results in pathlib.Path("benches/throughput").glob("*.md"):
            block = results.read_text().strip()
            pattern = rf"(<!-- bench:{results.stem} -->\n).*?(\n<!-- /bench:{results.stem} -->)"
            text = re.sub(pattern, lambda m: m[1] + block + m[2], text, flags=re.S)
        readme.write_text(text)
        PY

    - name: Commit & Push Benchmark Results
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        file_pattern: 'README.md benches/throughput/*.svg'
        commit_message: Update Benchmark Results
        commit_user_name: Benchmark Bot
        commit_user_email: benchmark-bot@noreply.com
        commit_author: Benchmark Bot <benchmark-bot@noreply.com>