name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:

  build_and_test:
    name: Build & Test ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: "aarch64"
          runner: "ubuntu-24.04-arm"
          baseline: "generic"
        - name: "X86_64"
          runner: "ubuntu-latest"
          baseline: "x86-64"

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Update rust
      run: rustup update

    - name: Info
      run: |
        cat /proc/cpuinfo | grep 'model name' | uniq
        cargo rustc -- --version

    - name: Build
      run: cargo build --release

    # Target features of the CPU enabled at compile time (see .cargo/config.toml): hardware backend inlined
    - name: Test
      run: cargo test --release

    # Baseline CPU: hardware backend detected at runtime
    - name: Test (runtime detection)
      run: cargo test --release
      env:
        RUSTFLAGS: "-C target-cpu=${{ matrix.baseline }}"
        RUSTDOCFLAGS: "-C target-cpu=${{ matrix.baseline }}"

    - name: Build (no_std)
      run: cargo build --release --no-default-features
