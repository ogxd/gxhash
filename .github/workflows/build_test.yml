name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:

  build_and_test:
    name: Build & Test ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: "aarch64"
          runner: "ubuntu-24.04-arm"
          baseline: "generic"
        - name: "X86_64"
          runner: "ubuntu-latest"
          baseline: "x86-64"

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Update rust
      run: rustup update

    - name: Info
      run: |
        cat /proc/cpuinfo | grep 'model name' | uniq
        cargo rustc -- --version

    - name: Build
      run: cargo build --release

    # Target features of the CPU enabled at compile time (see .cargo/config.toml): hardware backend inlined
    - name: Test
      run: cargo test --release

    # Baseline CPU: hardware backend detected at runtime
    - name: Test (runtime detection)
      run: cargo test --release
      env:
        RUSTFLAGS: "-C target-cpu=${{ matrix.baseline }}"
        RUSTDOCFLAGS: "-C target-cpu=${{ matrix.baseline }}"

    - name: Build (no_std)
      run: cargo build --release --no-default-features

  # Checks the unsafe code for undefined behavior. Miri can't run the inline assembly that loads beyond the input, so it
  # runs an equivalent that copies the input instead (see load_end). It doesn't support ARM AES intrinsics.
  miri:
    name: Miri ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: "AES-NI"
          rustflags: "-C target-feature=+aes"
        - name: "AES-NI + VAES"
          rustflags: "-C target-feature=+aes,+ssse3,+vaes,+avx2"
        # No AES instructions enabled at compile time, and Miri detects none at runtime
        - name: "Software"
          rustflags: "-C target-cpu=x86-64"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Miri
      run: rustup toolchain install nightly --profile minimal --component miri

    - name: Test
      run: cargo +nightly miri test --lib
      env:
        RUSTFLAGS: ${{ matrix.rustflags }}
